# SwiftLint Configuration for Readeck iOS
# Based on sindresorhus/swiftlint-config (Apple sample code style)

parent_config: .swiftlint-parent.yml

excluded:
  - .build
  - build
  - .claude
  - DerivedData
  - readeckTests
  - readeckUITests
  - Tests
  - Package.swift

disabled_rules:
  - switch_case_on_newline
  - no_extension_access_modifier
  - conditional_returns_on_newline

# Project-specific overrides
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - r
    - g
    - b
    - t
    - x
    - y
    - i
    - j
    - k
    - ButtonLabel
    - JumpButton
    - _body
